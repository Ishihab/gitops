
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: simple-social
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Ishihab/gitops.git
    targetRevision: main
    directory:
      recurse: true
    path: apps/simple-social          
  destination:
    server: https://kubernetes.default.svc
    namespace: simple-social           
  syncPolicy: 
    syncOptions:
      - CreateNamespace=true                      