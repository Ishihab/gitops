apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  sources: 
    - repoURL: https://argoproj.github.io/argo-helm
      targetRevision: "10.2.1"
      chart: argo-cd
      helm:
        valueFiles:
          - $values/values/argocd-values.yaml
    - repoURL: https://github.com/Ishihab/gitops.git
      targetRevision: main
      ref: values 
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
