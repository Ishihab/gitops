
serviceAccount:
  create: true
  name: external-secrets   

installCRDs: true   

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi


metrics:
  service:
    enabled: true

serviceMonitor:
  enabled: true
  additionalLabels:
    release: kube-prometheus-stack